<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Tienda Libre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .catalogo {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 250px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            margin: 10px 0 5px;
            font-size: 1.2em;
            color: #222;
        }

        .card .precio {
            font-size: 1.3em;
            font-weight: bold;
            color: #2e7d32;
            margin: 5px 0;
        }

        .card .descripcion {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .card .stock {
            font-size: 0.85em;
            color: #888;
        }

        .sin-productos {
            text-align: center;
            color: #777;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <h1>🛒 Catálogo de Productos</h1>

    <div class="catalogo">
        {% for producto in productos %}
            <div class="card">
                {% if producto.imagen_url %}
                    <img src="{{ producto.imagen_url }}" alt="{{ producto.nombre }}">
                {% else %}
                    <img src="https://via.placeholder.com/250x180?text=Sin+Imagen" alt="Sin imagen">
                {% endif %}

                <h3>{{ producto.nombre }}</h3>
                <p class="precio">${{ producto.precio }}</p>
                <p class="descripcion">{{ producto.descripcion }}</p>
                <p class="stock">Disponibles: {{ producto.stock }}</p>
            </div>
        {% empty %}
            <p class="sin-productos">No hay productos disponibles por el momento.</p>
        {% endfor %}
    </div>

</body>
</html>
